<svg xmlns="http://www.w3.org/2000/svg" class="geo" style="color:#1a1a1a;background:#fff" viewBox="0 0 320 265" width="320" height="265" role="img" aria-label="Hai điểm A, B cùng phía đường thẳng d, điểm M trên d và A' đối xứng với A qua d"><style>.thin{stroke-width:1.3}.aux{stroke-dasharray:5 4;stroke-width:1.2;opacity:.75}.hi{stroke:#0b3d91;stroke-width:2.2}.mark{stroke-width:1.1}.dot.hollow{fill:#fff;stroke:#1a1a1a;stroke-width:1.4}.lbl.small{font-size:13px;font-style:normal}</style><rect width="100%" height="100%" fill="#fff"/><g class="lines" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="15" y1="150" x2="305" y2="150" class="thin"/><line x1="70" y1="60" x2="70" y2="240" class="aux"/><line x1="70" y1="60" x2="147.1" y2="150" class="hi"/><line x1="147.1" y1="150" x2="250" y2="30" class="hi"/><line x1="70" y1="240" x2="147.1" y2="150" class="aux"/></g><g fill="currentColor" font-family="'Times New Roman',serif" font-style="italic" font-size="16" text-anchor="middle" dominant-baseline="central"><circle cx="70" cy="60" r="2.6" class="dot"/><text x="60" y="54" class="lbl">A</text><circle cx="250" cy="30" r="2.6" class="dot"/><text x="260" y="24" class="lbl">B</text><circle cx="147.1" cy="150" r="2.6" class="dot"/><text x="147.1" y="164" class="lbl">M</text><circle cx="70" cy="240" r="2.6" class="dot"/><text x="56" y="240" class="lbl">A'</text><text x="305" y="138" class="lbl">d</text></g></svg>
