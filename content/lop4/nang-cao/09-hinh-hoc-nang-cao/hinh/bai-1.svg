<svg xmlns="http://www.w3.org/2000/svg" class="geo" style="color:#1a1a1a;background:#fff" viewBox="0 0 320 90" width="320" height="90" role="img" aria-label="Sáu điểm A, B, C, D, E, G trên một đường thẳng"><style>.thin{stroke-width:1.3}.aux{stroke-dasharray:5 4;stroke-width:1.2;opacity:.75}.hi{stroke:#0b3d91;stroke-width:2.2}.mark{stroke-width:1.1}.dot.hollow{fill:#fff;stroke:#1a1a1a;stroke-width:1.4}.lbl.small{font-size:13px;font-style:normal}</style><rect width="100%" height="100%" fill="#fff"/><g class="lines" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="20" y1="45" x2="300" y2="45" class="thin"/></g><g fill="currentColor" font-family="'Times New Roman',serif" font-style="italic" font-size="16" text-anchor="middle" dominant-baseline="central"><circle cx="30" cy="45" r="2.6" class="dot"/><text x="30" y="31" class="lbl">A</text><circle cx="70" cy="45" r="2.6" class="dot"/><text x="70" y="31" class="lbl">B</text><circle cx="130" cy="45" r="2.6" class="dot"/><text x="130" y="31" class="lbl">C</text><circle cx="170" cy="45" r="2.6" class="dot"/><text x="170" y="31" class="lbl">D</text><circle cx="230" cy="45" r="2.6" class="dot"/><text x="230" y="31" class="lbl">E</text><circle cx="290" cy="45" r="2.6" class="dot"/><text x="290" y="31" class="lbl">G</text></g></svg>
