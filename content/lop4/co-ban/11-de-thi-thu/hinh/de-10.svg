<svg xmlns="http://www.w3.org/2000/svg" class="geo" style="color:#1a1a1a;background:#fff" viewBox="0 0 330 230" width="330" height="230" role="img" aria-label="Hình chữ nhật kéo dài thêm 5 cm và bớt chiều rộng 2 cm"><style>.thin{stroke-width:1.3}.aux{stroke-dasharray:5 4;stroke-width:1.2;opacity:.75}.hi{stroke:#0b3d91;stroke-width:2.2}.mark{stroke-width:1.1}.dot.hollow{fill:#fff;stroke:#1a1a1a;stroke-width:1.4}.lbl.small{font-size:13px;font-style:normal}</style><rect width="100%" height="100%" fill="#fff"/><g class="lines" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="30" y="40" width="192" height="128" class="hi"/><rect x="222" y="40" width="80" height="128" class="aux"/><line x1="30" y1="136" x2="222" y2="136" class="aux"/></g><g fill="currentColor" font-family="'Times New Roman',serif" font-style="italic" font-size="16" text-anchor="middle" dominant-baseline="central"><text x="126" y="29" class="lbl small">chiều dài</text><text x="262" y="29" class="lbl small">5 cm</text><text x="262" y="104" class="lbl small">40 cm²</text><text x="126" y="152" class="lbl small">24 cm²</text><text x="25" y="152" class="lbl small" text-anchor="end">2 cm</text></g></svg>
