<svg xmlns="http://www.w3.org/2000/svg" class="geo" style="color:#1a1a1a;background:#fff" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="Hình thang ABCD có đáy AB = 6 cm, CD = 12 cm"><style>.thin{stroke-width:1.3}.aux{stroke-dasharray:5 4;stroke-width:1.2;opacity:.75}.hi{stroke:#0b3d91;stroke-width:2.2}.mark{stroke-width:1.1}.dot.hollow{fill:#fff;stroke:#1a1a1a;stroke-width:1.4}.lbl.small{font-size:13px;font-style:normal}</style><rect width="100%" height="100%" fill="#fff"/><g class="lines" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="70,80 190,80 270,200 30,200"/><line x1="70" y1="80" x2="270" y2="200" class="hi"/></g><g fill="currentColor" font-family="'Times New Roman',serif" font-style="italic" font-size="16" text-anchor="middle" dominant-baseline="central"><circle cx="70" cy="80" r="2.6" class="dot"/><text x="64" y="68" class="lbl">A</text><circle cx="190" cy="80" r="2.6" class="dot"/><text x="196" y="68" class="lbl">B</text><circle cx="270" cy="200" r="2.6" class="dot"/><text x="280" y="208" class="lbl">C</text><circle cx="30" cy="200" r="2.6" class="dot"/><text x="20" y="208" class="lbl">D</text><text x="130" y="68" class="lbl small">6 cm</text><text x="150" y="214" class="lbl small">12 cm</text></g></svg>
