<svg xmlns="http://www.w3.org/2000/svg" class="geo" style="color:#1a1a1a;background:#fff" viewBox="0 0 320 130" width="320" height="130" role="img" aria-label="Sơ đồ quãng đường AB, hai xe gặp nhau tại C, M là trung điểm AB, MC = 10 km"><style>.thin{stroke-width:1.3}.aux{stroke-dasharray:5 4;stroke-width:1.2;opacity:.75}.hi{stroke:#0b3d91;stroke-width:2.2}.mark{stroke-width:1.1}.dot.hollow{fill:#fff;stroke:#1a1a1a;stroke-width:1.4}.lbl.small{font-size:13px;font-style:normal}</style><rect width="100%" height="100%" fill="#fff"/><g class="lines" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="20" y1="70" x2="300" y2="70"/><line x1="60" y1="66" x2="60" y2="74" class="mark"/><line x1="100" y1="66" x2="100" y2="74" class="mark"/><line x1="140" y1="66" x2="140" y2="74" class="mark"/><line x1="180" y1="66" x2="180" y2="74" class="mark"/><line x1="220" y1="66" x2="220" y2="74" class="mark"/><line x1="260" y1="66" x2="260" y2="74" class="mark"/><line x1="20" y1="70" x2="140" y2="70" class="hi"/><path d="M20 64 L20 30 M140 64 L140 30 M20 34 L140 34" class="aux"/><path d="M140 64 L140 30 M300 64 L300 30 M140 34 L300 34" class="aux"/><path d="M140 78 L140 100 M160 78 L160 100 M140 96 L160 96" class="aux"/></g><g fill="currentColor" font-family="'Times New Roman',serif" font-style="italic" font-size="16" text-anchor="middle" dominant-baseline="central"><circle cx="20" cy="70" r="2.6" class="dot"/><circle cx="300" cy="70" r="2.6" class="dot"/><circle cx="140" cy="70" r="2.6" class="dot"/><circle cx="160" cy="70" r="2.6" class="dot hollow"/><text x="20" y="86" class="lbl">A</text><text x="300" y="86" class="lbl">B</text><text x="130" y="86" class="lbl">C</text><text x="170" y="86" class="lbl">M</text><text x="80" y="22" class="lbl small">3 phần</text><text x="220" y="22" class="lbl small">4 phần</text><text x="150" y="114" class="lbl small">10 km</text></g></svg>