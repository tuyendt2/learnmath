<svg xmlns="http://www.w3.org/2000/svg" class="geo" style="color:#1a1a1a;background:#fff" viewBox="0 0 330 250" width="330" height="250" role="img" aria-label="Vườn hình chữ nhật 30 m × 20 m với lối đi rộng 2 m bao quanh"><style>.thin{stroke-width:1.3}.aux{stroke-dasharray:5 4;stroke-width:1.2;opacity:.75}.hi{stroke:#0b3d91;stroke-width:2.2}.mark{stroke-width:1.1}.dot.hollow{fill:#fff;stroke:#1a1a1a;stroke-width:1.4}.lbl.small{font-size:13px;font-style:normal}</style><rect width="100%" height="100%" fill="#fff"/><g class="lines" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="25" y="25" width="272" height="192" class="thin" fill="#e8eef8"/><rect x="41" y="41" width="240" height="160" class="hi" fill="#fff"/></g><g fill="currentColor" font-family="'Times New Roman',serif" font-style="italic" font-size="16" text-anchor="middle" dominant-baseline="central"><text x="161" y="121" class="lbl small">vườn 30 m × 20 m</text><text x="161" y="33" class="lbl small">lối đi 2 m</text></g></svg>
