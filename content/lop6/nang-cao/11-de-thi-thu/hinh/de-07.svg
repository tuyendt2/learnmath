<svg xmlns="http://www.w3.org/2000/svg" class="geo" style="color:#1a1a1a;background:#fff" viewBox="0 0 320 90" width="320" height="90" role="img" aria-label="Đoạn thẳng AB, điểm C, trung điểm M của AC, N của CB và trung điểm I của MN"><style>.thin{stroke-width:1.3}.aux{stroke-dasharray:5 4;stroke-width:1.2;opacity:.75}.hi{stroke:#0b3d91;stroke-width:2.2}.mark{stroke-width:1.1}.dot.hollow{fill:#fff;stroke:#1a1a1a;stroke-width:1.4}.lbl.small{font-size:13px;font-style:normal}</style><rect width="100%" height="100%" fill="#fff"/><g class="lines" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="15" y1="50" x2="305" y2="50" class="thin"/></g><g fill="currentColor" font-family="'Times New Roman',serif" font-style="italic" font-size="16" text-anchor="middle" dominant-baseline="central"><circle cx="30" cy="50" r="2.6" class="dot"/><text x="30" y="37" class="lbl">A</text><circle cx="82" cy="50" r="2.6" class="dot"/><text x="82" y="37" class="lbl">M</text><circle cx="134" cy="50" r="2.6" class="dot"/><text x="134" y="37" class="lbl">C</text><circle cx="147" cy="50" r="2.6" class="dot hollow"/><text x="147" y="37" class="lbl">I</text><circle cx="212" cy="50" r="2.6" class="dot"/><text x="212" y="37" class="lbl">N</text><circle cx="290" cy="50" r="2.6" class="dot"/><text x="290" y="37" class="lbl">B</text></g></svg>
