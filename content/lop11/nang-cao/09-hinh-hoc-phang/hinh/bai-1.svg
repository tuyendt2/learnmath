<svg xmlns="http://www.w3.org/2000/svg" class="geo" style="color:#1a1a1a;background:#fff" viewBox="0 0 320 260" width="320" height="260" role="img" aria-label="Hai điểm A, B ở hai bên bờ sông, cầu MN vuông góc với hai bờ, A′ là ảnh của A qua phép tịnh tiến theo vectơ MN"><style>.thin{stroke-width:1.3}.aux{stroke-dasharray:5 4;stroke-width:1.2;opacity:.75}.hi{stroke:#0b3d91;stroke-width:2.2}.mark{stroke-width:1.1}.dot.hollow{fill:#fff;stroke:#1a1a1a;stroke-width:1.4}.lbl.small{font-size:13px;font-style:normal}</style><rect width="100%" height="100%" fill="#fff"/><g class="lines" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="100" x2="310" y2="100"/><line x1="10" y1="150" x2="310" y2="150"/><rect x="10" y="100" width="300" height="50" class="none" fill="#e8eef8"/><line x1="60" y1="30" x2="153.3" y2="100" class="hi"/><line x1="153.3" y1="100" x2="153.3" y2="150" class="hi"/><line x1="153.3" y1="150" x2="260" y2="230" class="hi"/><line x1="60" y1="30" x2="60" y2="80" class="aux"/><line x1="60" y1="80" x2="153.3" y2="150" class="aux"/></g><g fill="currentColor" font-family="'Times New Roman',serif" font-style="italic" font-size="16" text-anchor="middle" dominant-baseline="central"><circle cx="60" cy="30" r="2.6" class="dot"/><text x="50" y="24" class="lbl">A</text><circle cx="260" cy="230" r="2.6" class="dot"/><text x="270" y="236" class="lbl">B</text><circle cx="60" cy="80" r="2.6" class="dot"/><text x="46" y="84" class="lbl">A′</text><circle cx="153.3" cy="100" r="2.6" class="dot"/><text x="149.3" y="90" class="lbl">M</text><circle cx="153.3" cy="150" r="2.6" class="dot"/><text x="161.3" y="164" class="lbl">N</text></g></svg>
