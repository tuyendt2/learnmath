<svg xmlns="http://www.w3.org/2000/svg" class="geo" style="color:#1a1a1a;background:#fff" viewBox="0 0 320 290" width="320" height="290" role="img" aria-label="Hình vuông cạnh a mở rộng một cạnh thêm 3 m, cạnh kia thêm 2 m"><style>.thin{stroke-width:1.3}.aux{stroke-dasharray:5 4;stroke-width:1.2;opacity:.75}.hi{stroke:#0b3d91;stroke-width:2.2}.mark{stroke-width:1.1}.dot.hollow{fill:#fff;stroke:#1a1a1a;stroke-width:1.4}.lbl.small{font-size:13px;font-style:normal}</style><rect width="100%" height="100%" fill="#fff"/><g class="lines" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="40" y="35" width="225" height="210" class="thin"/><rect x="40" y="35" width="180" height="180" class="hi"/><line x1="220" y1="35" x2="220" y2="245" class="aux"/><line x1="40" y1="215" x2="265" y2="215" class="aux"/></g><g fill="currentColor" font-family="'Times New Roman',serif" font-style="italic" font-size="16" text-anchor="middle" dominant-baseline="central"><text x="130" y="24" class="lbl small">a</text><text x="242.5" y="24" class="lbl small">3 m</text><text x="34" y="230" class="lbl small" text-anchor="end">2 m</text><text x="130" y="125" class="lbl small">hình vuông cũ</text></g></svg>
