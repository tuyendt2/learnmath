<svg xmlns="http://www.w3.org/2000/svg" class="geo" style="color:#1a1a1a;background:#fff" viewBox="0 0 320 270" width="320" height="270" role="img" aria-label="Tam giác ABC cân tại A, D trên AB, E trên tia đối của tia CA với BD = CE, DE cắt BC tại I"><style>.thin{stroke-width:1.3}.aux{stroke-dasharray:5 4;stroke-width:1.2;opacity:.75}.hi{stroke:#0b3d91;stroke-width:2.2}.mark{stroke-width:1.1}.dot.hollow{fill:#fff;stroke:#1a1a1a;stroke-width:1.4}.lbl.small{font-size:13px;font-style:normal}</style><rect width="100%" height="100%" fill="#fff"/><g class="lines" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="130,20 50,170 210,170"/><line x1="210" y1="170" x2="240.4" y2="227"/><line x1="80.4" y1="113" x2="240.4" y2="227" class="hi"/><line x1="80.4" y1="113" x2="110.8" y2="170" class="aux"/><line x1="60.8" y1="139.1" x2="69.6" y2="143.9" class="mark"/><line x1="229.6" y1="196.1" x2="220.8" y2="200.9" class="mark"/></g><g fill="currentColor" font-family="'Times New Roman',serif" font-style="italic" font-size="16" text-anchor="middle" dominant-baseline="central"><circle cx="130" cy="20" r="2.6" class="dot"/><text x="130" y="7" class="lbl">A</text><circle cx="50" cy="170" r="2.6" class="dot"/><text x="40" y="178" class="lbl">B</text><circle cx="210" cy="170" r="2.6" class="dot"/><text x="220" y="164" class="lbl">C</text><circle cx="80.4" cy="113" r="2.6" class="dot"/><text x="68.4" y="111" class="lbl">D</text><circle cx="240.4" cy="227" r="2.6" class="dot"/><text x="250.4" y="233" class="lbl">E</text><circle cx="160.4" cy="170" r="2.6" class="dot"/><text x="164.4" y="184" class="lbl">I</text><circle cx="110.8" cy="170" r="2.6" class="dot"/><text x="106.8" y="184" class="lbl">F</text></g></svg>
