<svg xmlns="http://www.w3.org/2000/svg" class="geo" style="color:#1a1a1a;background:#fff" viewBox="0 0 320 275" width="320" height="275" role="img" aria-label="Tam giác ABC với tâm ngoại tiếp O, trọng tâm G, trực tâm H thẳng hàng trên đường thẳng Euler"><style>.thin{stroke-width:1.3}.aux{stroke-dasharray:5 4;stroke-width:1.2;opacity:.75}.hi{stroke:#0b3d91;stroke-width:2.2}.mark{stroke-width:1.1}.dot.hollow{fill:#fff;stroke:#1a1a1a;stroke-width:1.4}.lbl.small{font-size:13px;font-style:normal}</style><rect width="100%" height="100%" fill="#fff"/><g class="lines" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="95,20 25,250 295,250"/><line x1="95" y1="20" x2="95" y2="250" class="aux"/><line x1="25" y1="250" x2="178.7" y2="116.3" class="aux"/><path d="M95 241 L104 241 L104 250" class="mark"/><line x1="160" y1="165.4" x2="160" y2="250" class="aux"/><line x1="186" y1="156" x2="56" y2="203.3" class="hi"/></g><g fill="currentColor" font-family="'Times New Roman',serif" font-style="italic" font-size="16" text-anchor="middle" dominant-baseline="central"><circle cx="95" cy="20" r="2.6" class="dot"/><text x="95" y="7" class="lbl">A</text><circle cx="25" cy="250" r="2.6" class="dot"/><text x="15" y="258" class="lbl">B</text><circle cx="295" cy="250" r="2.6" class="dot"/><text x="305" y="258" class="lbl">C</text><circle cx="160" cy="165.4" r="2.6" class="dot"/><text x="170" y="171.4" class="lbl">O</text><circle cx="138.3" cy="173.3" r="2.6" class="dot"/><text x="140.3" y="187.3" class="lbl">G</text><circle cx="95" cy="189.1" r="2.6" class="dot"/><text x="83" y="187.1" class="lbl">H</text><circle cx="160" cy="250" r="2.6" class="dot"/><text x="160" y="264" class="lbl">M</text></g></svg>
